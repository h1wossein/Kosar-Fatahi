.pri{font:inherit;background:var(--ac2);color:#1d1305;border:0;padding:8px 18px;border-radius:10px;font-weight:600;cursor:pointer}
.sc{font-weight:800;color:var(--ac)}
.hide{display:none}

const $=id=>document.getElementById(id);let cur=0,mode="notes";
const nav=$("nav");
D.forEach((d,i)=>{const b=document.createElement("button");b.textContent=d.t;b.onclick=()=>{mode="notes";cur=i;show()};nav.append(b)});
const qb=document.createElement("button");qb.textContent="آزمون تستی";qb.onclick=()=>{mode="quiz";show();startQ()};nav.append(qb);
function show(){[...nav.children].forEach((b,i)=>b.classList.toggle("on",mode==="quiz"?i===D.length:i===cur));$("notes").classList.toggle("hide",mode!=="notes");$("quiz").classList.toggle("hide",mode!=="quiz");if(mode==="notes")renderN()}
function renderN(){const q=$("s").value.trim();const L=$("list");L.innerHTML="";
D[cur].k.forEach(([h,items])=>{const it=q?items.filter(x=>x.includes(q)||h.includes(q)):items;if(!it.length)return;
const d=document.createElement("details");d.open=!!q||true;d.innerHTML="<summary>"+h+"</summary><ul>"+it.map(x=>"<li>"+x+"</li>").join("")+"</ul>";L.append(d)})}
$("s").oninput=renderN;
let sc=0,ans=0,qs=[];
function startQ(){sc=0;ans=0;qs=[...Q].sort(()=>Math.random()-.5);upd();const box=$("qs");box.innerHTML="";
qs.forEach((q,n)=>{const e=document.createElement("div");e.className="q";e.innerHTML="<h3>"+(n+1)+". "+q[0]+"</h3>";
q[1].forEach((o,j)=>{const b=document.createElement("button");b.className="o";b.textContent=o;b.onclick=()=>{if(e.dataset.d)return;e.dataset.d=1;ans++;
if(j===q[2]){b.classList.add("ok");sc++}else{b.classList.add("no");e.children[q[2]+1].classList.add("ok")}
const p=e.querySelector(".ex");p.style.display="block";upd()};e.append(b)});
const p=document.createElement("p");p.className="ex";p.textContent="توضیح: "+q[3];e.append(p);box.append(e)})}
